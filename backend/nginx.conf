# Nginx configuration for Emfudweni High School
# Location: /etc/nginx/sites-available/emfudweni
# Enable:  sudo ln -s /etc/nginx/sites-available/emfudweni /etc/nginx/sites-enabled/
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx

server {
    listen 80;
    server_name yourdomain.co.za www.yourdomain.co.za;  # Replace with your actual domain

    # Upload size limit
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/emfudweni-access.log;
    error_log /var/log/nginx/emfudweni-error.log;

    # ─── Frontend: Serve React static files ───
    root /var/www/emfudweni/frontend;
    index index.html;

    # All API requests → proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets → cache aggressively
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA → always serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ─── SSL Configuration ───
# After running: sudo certbot --nginx -d yourdomain.co.za -d www.yourdomain.co.za
# Certbot will automatically modify this file to add SSL settings.
